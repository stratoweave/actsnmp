# net-snmp snmpd configuration for the actsnmp interop lab.
# Started as: snmpd -f -Lo -C -c /opt/actsnmp/config/snmpd.conf

# listen on loopback only (container runs with --network host)
agentaddress udp:127.0.0.1:16161,udp6:[::1]:16161,tcp:127.0.0.1:16161,tcp6:[::1]:16161

# fixed engine ID so that tests are deterministic
exactEngineID 0x80001f8880616374736e6d7064

# system group: sysDescr/sysObjectID are read-only, sysContact/sysName/
# sysLocation are initialised with the p* (persistent) tokens which keeps
# them WRITABLE via SNMP SET (community private / v3 users).
sysdescr actsnmp interop lab net-snmp agent
sysobjectid .1.3.6.1.4.1.8072.3.2.10
sysservices 72
psyscontact actsnmp-contact
psysname actsnmp-snmpd
psyslocation actsnmp-lab

# deterministic test dataset (see interop/dataset/actsnmp_dataset.py)
pass_persist .1.3.6.1.4.1.8072.9999.1 /opt/actsnmp/dataset/actsnmp_pass.py

# ---------------------------------------------------------------- VACM
view all     included .1
view rwview  included .1.3.6.1.4.1.8072.9999.1.20
view rwview  included .1.3.6.1.2.1.1.4
view rwview  included .1.3.6.1.2.1.1.5
view rwview  included .1.3.6.1.2.1.1.6
view sysview included .1.3.6.1.2.1.1

# SNMPv1/v2c communities
#   public  : read-only, everything
#   private : read everything, write rwview (dataset .20 + sysContact/Name/Location)
#   sysonly : read-only, system group only (view boundary tests)
com2sec  sec_public   default public
com2sec6 sec_public   default public
com2sec  sec_private  default private
com2sec6 sec_private  default private
com2sec  sec_sysonly  default sysonly
com2sec6 sec_sysonly  default sysonly
group grp_public   v1  sec_public
group grp_public   v2c sec_public
group grp_private  v1  sec_private
group grp_private  v2c sec_private
group grp_sysonly  v1  sec_sysonly
group grp_sysonly  v2c sec_sysonly
access grp_public  "" any noauth exact all     none   none
access grp_private "" any noauth exact all     rwview none
access grp_sysonly "" any noauth exact sysview none   none

